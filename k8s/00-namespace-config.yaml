apiVersion: v1
kind: Namespace
metadata: { name: rims }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: rims-config, namespace: rims }
data:
  NODE_ENV: production
  PORT: "4000"
  DB_PORT: "3306"
  DB_NAME: rims
  DB_POOL: "10"
  JWT_EXPIRES_IN: 8h
  TRUST_PROXY: "1"
  # Public URL(s) of the frontend. Replace for your domain.
  CORS_ORIGINS: https://rims.example.com
  RATE_LIMIT_PER_MINUTE: "300"
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: rims-backend, namespace: rims }
  # For IRSA (e.g. reading Secrets Manager directly), annotate with:
  # annotations: { eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/rims-backend }
