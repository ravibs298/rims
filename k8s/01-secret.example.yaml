# EXAMPLE ONLY. Do not commit real values.
# Recommended: sync from AWS Secrets Manager with External Secrets Operator or the Secrets Store CSI driver,
# producing a Secret named "rims-secrets" with these keys. Integration credentials (INTEGRATION_*) go here too.
apiVersion: v1
kind: Secret
metadata: { name: rims-secrets, namespace: rims }
type: Opaque
stringData:
  DB_HOST: "<rds-endpoint>.rds.amazonaws.com"
  DB_USER: "rims_app"
  DB_PASSWORD: "<from-secrets-manager>"
  JWT_SECRET: "<openssl rand -hex 32>"
  # INTEGRATION_ERP_TOKEN: "<only when a real ERP is configured>"
