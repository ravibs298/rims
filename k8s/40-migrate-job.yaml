# Run BEFORE rolling out a new backend image (Jenkins does this). Migrations are forward-only and tracked in schema_migrations.
apiVersion: batch/v1
kind: Job
metadata: { name: "rims-migrate-${IMAGE_TAG}", namespace: rims }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: migrate
          image: ${ECR_REGISTRY}/rims-backend:${IMAGE_TAG}
          command: ["node", "backend/dist/migrate.js"]
          envFrom:
            - configMapRef: { name: rims-config }
            - secretRef: { name: rims-secrets }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
